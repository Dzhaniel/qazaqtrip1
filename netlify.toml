[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA fallback (Netlify Functions take priority over redirects, so /api/guide works)
[[redirects]]
  from = "/api/guide"
  to = "/.netlify/functions/guide"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
